<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techorama 2026 — My Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e14;
    --surface: #13161f;
    --surface2: #1a1e2a;
    --border: #252a38;
    --accent: #f5a623;
    --accent2: #e05252;
    --text: #e8eaf0;
    --muted: #6b7280;
    --ai: #7c6af5;
    --arch: #e05252;
    --cloud: #38b2ac;
    --data: #f59e0b;
    --dev: #48bb78;
    --workplace: #ed64a6;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    min-height: 60px;
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: .5rem;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }

  .header-controls {
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }

  .tab-group {
    display: flex;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 600;
    padding: .35rem .9rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--accent); color: #0c0e14; }

  .my-schedule-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    padding: .35rem .9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .my-schedule-btn.active, .my-schedule-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c0e14;
  }
  .my-schedule-count {
    background: var(--accent2);
    color: white;
    font-size: .7rem;
    border-radius: 99px;
    padding: .1rem .4rem;
    min-width: 1.4rem;
    text-align: center;
  }
  .my-schedule-btn.active .my-schedule-count { background: rgba(0,0,0,.3); color: #0c0e14; }

  /* ── STATUS BAR ── */
  .status-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: .4rem 1.5rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    font-family: 'DM Mono', monospace;
    font-size: .72rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  .status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
  .status-dot.ok { background: var(--dev); }
  .status-dot.error { background: var(--accent2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .status-text { flex: 1; }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    padding: .15rem .5rem;
    border-radius: 5px;
    cursor: pointer;
    transition: all .2s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── FILTERS ── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-size: .7rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-right: .25rem;
  }
  .filter-chip {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: .75rem;
    font-weight: 600;
    padding: .25rem .7rem;
    border-radius: 99px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--text); color: var(--text); }
  .filter-chip.active { color: #0c0e14; border-color: transparent; }
  .chip-ai.active { background: var(--ai); color: white; }
  .chip-arch.active { background: var(--arch); }
  .chip-cloud.active { background: var(--cloud); color: #0c0e14; }
  .chip-data.active { background: var(--data); color: #0c0e14; }
  .chip-dev.active { background: var(--dev); color: #0c0e14; }
  .chip-workplace.active { background: var(--workplace); }

  /* ── MAIN ── */
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  /* ── SKELETON LOADER ── */
  .skeleton-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 130px;
    margin-bottom: .75rem;
    animation: shimmer 1.4s infinite;
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── TIME BLOCKS ── */
  .time-block { margin-bottom: 2rem; }
  .time-header { display: flex; align-items: center; gap: 1rem; margin-bottom: .75rem; }
  .time-label { font-family: 'DM Mono', monospace; font-size: .85rem; color: var(--accent); font-weight: 500; white-space: nowrap; }
  .time-divider { flex: 1; height: 1px; background: var(--border); }

  .event-special {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .6rem 1rem;
    font-size: .85rem;
    color: var(--muted);
    font-style: italic;
  }

  /* ── SESSION GRID ── */
  .sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .75rem; }

  /* ── SESSION CARD ── */
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    transition: border-color .2s, transform .15s, box-shadow .2s;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .session-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(245,166,35,.1); }
  .session-card.selected { border-color: var(--accent); background: #1e1b10; box-shadow: 0 0 0 2px rgba(245,166,35,.2); }
  .session-card.conflict { border-color: var(--accent2) !important; background: #1e1010; }
  .session-card.hidden { display: none; }
  .session-card.new-session { animation: highlight-new .8s ease-out; }
  @keyframes highlight-new { 0%{box-shadow:0 0 0 3px rgba(72,187,120,.6)} 100%{box-shadow:none} }
  .session-card.removed-session { opacity: .4; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
  .card-room { font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted); white-space: nowrap; }

  .card-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    font-size: .7rem;
  }
  .session-card.selected .card-check { background: var(--accent); border-color: var(--accent); color: #0c0e14; }
  .session-card.conflict .card-check { background: var(--accent2); border-color: var(--accent2); color: white; }

  .card-title { font-size: .9rem; font-weight: 700; line-height: 1.3; }
  .card-speaker { font-size: .8rem; color: var(--muted); }

  .card-footer { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .25rem; }

  .tag-category {
    font-size: .65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: .2rem .6rem; border-radius: 99px; color: white;
  }
  .tag-ai { background: var(--ai); }
  .tag-arch { background: var(--arch); }
  .tag-cloud { background: var(--cloud); color: #0c0e14; }
  .tag-data { background: var(--data); color: #0c0e14; }
  .tag-dev { background: var(--dev); color: #0c0e14; }
  .tag-workplace { background: var(--workplace); }

  .tag-level { font-size: .65rem; font-weight: 600; color: var(--muted); border: 1px solid var(--border); padding: .2rem .6rem; border-radius: 99px; }

  .conflict-badge { font-size: .65rem; font-weight: 700; color: var(--accent2); display: none; }
  .session-card.conflict .conflict-badge { display: inline; }

  /* ── MY SCHEDULE VIEW ── */
  .my-schedule-view { display: none; }
  .my-schedule-view.active { display: block; }
  .main-schedule-view.hidden { display: none; }

  .schedule-day-header {
    font-size: 1.1rem; font-weight: 800; color: var(--accent);
    margin: 1.5rem 0 1rem;
    display: flex; align-items: center; gap: .75rem;
  }
  .schedule-day-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .my-schedule-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .9rem 1.1rem;
    margin-bottom: .5rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .my-item-time { font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--accent); white-space: nowrap; min-width: 90px; }
  .my-item-room { font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--muted); min-width: 60px; }
  .my-item-body { flex: 1; }
  .my-item-title { font-size: .9rem; font-weight: 700; }
  .my-item-speaker { font-size: .8rem; color: var(--muted); margin-top: .15rem; }
  .my-item-remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1.1rem; line-height: 1; padding: .2rem;
    transition: color .2s; flex-shrink: 0;
  }
  .my-item-remove:hover { color: var(--accent2); }

  .empty-state { text-align: center; color: var(--muted); padding: 4rem 2rem; }
  .empty-state p:first-child { font-size: 2rem; margin-bottom: .5rem; }

  .export-bar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
  .export-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-family: 'Syne', sans-serif; font-size: .8rem; font-weight: 700;
    padding: .4rem 1rem; border-radius: 8px; cursor: pointer; transition: all .2s;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: .8rem;
    padding: .6rem 1.2rem; border-radius: 99px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: transform .3s ease, opacity .3s ease;
    opacity: 0; pointer-events: none; z-index: 200; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { border-color: var(--dev); }
  .toast.error { border-color: var(--accent2); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: .75rem 1rem; gap: .5rem; }
    .tab-btn { padding: .3rem .6rem; font-size: .75rem; }
    main { padding: 1rem .75rem 3rem; }
    .sessions-grid { grid-template-columns: 1fr; }
    .my-schedule-item { flex-wrap: wrap; gap: .4rem; }
    .my-item-time, .my-item-room { min-width: auto; }
    .status-bar { padding: .4rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚔️ Techora<span>ma</span> '26</div>
  <div class="header-controls">
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchDay('tuesday')">Tuesday</button>
      <button class="tab-btn" onclick="switchDay('wednesday')">Wednesday</button>
    </div>
    <button class="my-schedule-btn" id="mySchedBtn" onclick="toggleMySchedule()">
      ★ My Schedule
      <span class="my-schedule-count" id="mySchedCount">0</span>
    </button>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <div class="status-dot loading" id="statusDot"></div>
  <span class="status-text" id="statusText">Loading schedule…</span>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)" disabled>↻ Refresh</button>
</div>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Filter:</span>
  <button class="filter-chip chip-ai active"        data-cat="AI & Agents"               onclick="toggleFilter(this)">AI & Agents</button>
  <button class="filter-chip chip-arch active"      data-cat="Architecture & Leadership"  onclick="toggleFilter(this)">Architecture</button>
  <button class="filter-chip chip-cloud active"     data-cat="Cloud & DevOps"             onclick="toggleFilter(this)">Cloud & DevOps</button>
  <button class="filter-chip chip-data active"      data-cat="Data"                       onclick="toggleFilter(this)">Data</button>
  <button class="filter-chip chip-dev active"       data-cat="Dev"                        onclick="toggleFilter(this)">Dev</button>
  <button class="filter-chip chip-workplace active" data-cat="Workplace & Productivity"   onclick="toggleFilter(this)">Workplace</button>
</div>

<main>
  <div class="main-schedule-view" id="mainScheduleView">
    <!-- skeleton while loading -->
    <div id="skeletonLoader">
      <div class="skeleton-block"></div>
      <div class="skeleton-block"></div>
      <div class="skeleton-block"></div>
    </div>
  </div>
  <div class="my-schedule-view" id="myScheduleView"></div>
</main>

<div class="toast" id="toast"></div>

async function loadDay(day) {
  const url = `data/${day}.json?t=${Date.now()}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function loadData(manual = false) {
  setStatus('loading', 'Fetching latest schedule…');
  document.getElementById('refreshBtn').disabled = true;

  // Always start immediately from embedded data so the page is usable at once
  const hadData = !!SCHEDULE_DATA.tuesday;
  if (!hadData) {
    SCHEDULE_DATA.tuesday   = FALLBACK.tuesday;
    SCHEDULE_DATA.wednesday = FALLBACK.wednesday;
    renderSchedule();
    const ts = new Date(FALLBACK.tuesday.scraped_at);
    const fmt = ts.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
    setStatus('ok', `Showing embedded data from ${fmt} — checking for updates…`);
  }

  // Then attempt to fetch fresh JSON in the background
  try {
    const [tue, wed] = await Promise.all([loadDay('tuesday'), loadDay('wednesday')]);

    const prevTue = SCHEDULE_DATA.tuesday;
    const prevWed = SCHEDULE_DATA.wednesday;

    SCHEDULE_DATA.tuesday   = tue;
    SCHEDULE_DATA.wednesday = wed;

    const changes = detectChanges(prevTue, tue) + detectChanges(prevWed, wed);
    if (changes > 0) {
      renderSchedule();
      if (showingMySchedule) renderMySchedule();
      showToast(`Schedule updated — ${changes} session${changes > 1 ? 's' : ''} changed`, 'success');
    } else if (manual) {
      showToast('Schedule is up to date', 'success');
    }

    const ts = new Date(tue.scraped_at);
    const fmt = ts.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
    setStatus('ok', `Schedule last fetched ${fmt}`);

  } catch (err) {
    // Fetch failed (e.g. opened as local file, or offline) — embedded data is already showing
    const ts = new Date(FALLBACK.tuesday.scraped_at);
    const fmt = ts.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
    if (manual) {
      showToast('Could not reach server — showing last known schedule', 'error');
    }
    setStatus('error', `Offline — showing embedded data from ${fmt}`);
  } finally {
    document.getElementById('refreshBtn').disabled = false;
  }
}

function detectChanges(prev, next) {
  if (!prev || !next) return 0;
  const prevIds = new Set(allSessionIds(prev));
  const nextIds = new Set(allSessionIds(next));
  let count = 0;
  for (const id of nextIds) if (!prevIds.has(id)) count++;
  for (const id of prevIds) if (!nextIds.has(id)) count++;
  return count;
}

function allSessionIds(dayData) {
  const ids = [];
  for (const block of dayData.blocks || [])
    for (const s of block.sessions || []) ids.push(s.id);
  return ids;
}

// ─── STATUS BAR ───────────────────────────────────────────────────────────────

function setStatus(state, text) {
  document.getElementById('statusDot').className = `status-dot ${state}`;
  document.getElementById('statusText').textContent = text;
}

// ─── TOAST ────────────────────────────────────────────────────────────────────

let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = `toast ${type}`; }, 3500);
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function catClass(cat) {
  return { 'AI & Agents':'ai', 'Architecture & Leadership':'arch', 'Cloud & DevOps':'cloud',
           'Data':'data', 'Dev':'dev', 'Workplace & Productivity':'workplace' }[cat] || 'dev';
}
function catShort(cat) {
  return { 'AI & Agents':'AI & Agents', 'Architecture & Leadership':'Architecture',
           'Cloud & DevOps':'Cloud & DevOps', 'Data':'Data', 'Dev':'Dev',
           'Workplace & Productivity':'Workplace' }[cat] || cat;
}

function getConflicts() {
  const timeMap = {};
  for (const day of ['tuesday','wednesday']) {
    const data = SCHEDULE_DATA[day];
    if (!data) continue;
    for (const block of data.blocks) {
      if (!block.sessions) continue;
      for (const s of block.sessions) {
        if (selected[s.id]) {
          const key = `${day}_${block.time}`;
          (timeMap[key] = timeMap[key] || []).push(s.id);
        }
      }
    }
  }
  const out = new Set();
  for (const ids of Object.values(timeMap)) if (ids.length > 1) ids.forEach(id => out.add(id));
  return out;
}

function buildSessionLookup() {
  const map = {};
  for (const day of ['tuesday','wednesday']) {
    const data = SCHEDULE_DATA[day];
    if (!data) continue;
    for (const block of data.blocks) {
      if (!block.sessions) continue;
      for (const s of block.sessions) map[s.id] = { ...s, day, time: block.time };
    }
  }
  return map;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────

function renderSchedule() {
  const data = SCHEDULE_DATA[currentDay];
  if (!data) return;

  const conflicts = getConflicts();
  const container = document.getElementById('mainScheduleView');
  container.innerHTML = '';

  for (const block of data.blocks) {
    const div = document.createElement('div');
    div.className = 'time-block';

    if (block.special) {
      div.innerHTML = `
        <div class="time-header">
          <span class="time-label">${block.time}</span>
          <div class="time-divider"></div>
        </div>
        <div class="event-special">${block.special}</div>`;
    } else {
      const cards = block.sessions.map(s => {
        const isSel  = !!selected[s.id];
        const isConf = conflicts.has(s.id);
        const hidden = activeFilters.has(s.cat) ? '' : ' hidden';
        return `
          <div class="session-card${isSel?' selected':''}${isConf?' conflict':''}${hidden}"
               id="card-${s.id}" onclick="toggleSession('${s.id}')">
            <div class="card-top">
              <span class="card-room">${s.room}</span>
              <div class="card-check">${isSel?'✓':''}</div>
            </div>
            <div class="card-title">
              <a href="${s.url}" target="_blank" onclick="event.stopPropagation()"
                 style="color:inherit;text-decoration:none">${s.title}</a>
            </div>
            <div class="card-speaker">${s.speaker}</div>
            <div class="card-footer">
              <span class="tag-category tag-${catClass(s.cat)}">${catShort(s.cat)}</span>
              <span class="tag-level">${s.level}</span>
              <span class="conflict-badge">⚠ conflict</span>
            </div>
          </div>`;
      }).join('');

      div.innerHTML = `
        <div class="time-header">
          <span class="time-label">${block.time}</span>
          <div class="time-divider"></div>
        </div>
        <div class="sessions-grid">${cards}</div>`;
    }
    container.appendChild(div);
  }
}

function renderMySchedule() {
  const view = document.getElementById('myScheduleView');
  const lookup = buildSessionLookup();
  const ids = Object.keys(selected).filter(id => selected[id]);

  if (ids.length === 0) {
    view.innerHTML = `<div class="empty-state"><p>📋</p><p>No sessions added yet.<br>Browse the schedule and tap any card to add it.</p></div>`;
    return;
  }

  const conflicts = getConflicts();
  const byDay = { tuesday: [], wednesday: [] };
  for (const id of ids) {
    const s = lookup[id];
    if (s) byDay[s.day].push(s);
  }
  for (const d of ['tuesday','wednesday']) byDay[d].sort((a,b) => a.time.localeCompare(b.time));

  const renderItems = sessions => sessions.map(s => `
    <div class="my-schedule-item" style="${conflicts.has(s.id)?'border-color:var(--accent2)':''}">
      <div class="my-item-time">${s.time}</div>
      <div class="my-item-room">${s.room}</div>
      <div class="my-item-body">
        <div class="my-item-title">
          <a href="${s.url}" target="_blank" style="color:inherit;text-decoration:none">${s.title}</a>
        </div>
        <div class="my-item-speaker">
          ${s.speaker}
          &middot; <span class="tag-category tag-${catClass(s.cat)}" style="font-size:.6rem;padding:.15rem .5rem">${catShort(s.cat)}</span>
          ${conflicts.has(s.id)?'<span style="color:var(--accent2);font-size:.75rem"> ⚠ conflict</span>':''}
        </div>
      </div>
      <button class="my-item-remove" onclick="removeSession('${s.id}')" title="Remove">✕</button>
    </div>`).join('');

  let html = `<div class="export-bar"><button class="export-btn" onclick="exportSchedule()">⬇ Export as text</button></div>`;
  if (byDay.tuesday.length)   html += `<div class="schedule-day-header">Tuesday, May 12</div>`   + renderItems(byDay.tuesday);
  if (byDay.wednesday.length) html += `<div class="schedule-day-header">Wednesday, May 13</div>` + renderItems(byDay.wednesday);

  view.innerHTML = html;
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────

function toggleSession(id) {
  selected[id] = !selected[id];
  if (!selected[id]) delete selected[id];
  saveSelected();
  updateCount();
  renderSchedule();
}

function removeSession(id) {
  delete selected[id];
  saveSelected();
  updateCount();
  renderMySchedule();
  renderSchedule();
}

function updateCount() {
  document.getElementById('mySchedCount').textContent = Object.keys(selected).length;
}

function switchDay(day) {
  currentDay = day;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i===0 && day==='tuesday') || (i===1 && day==='wednesday'));
  });
  if (!showingMySchedule) renderSchedule();
}

function toggleMySchedule() {
  showingMySchedule = !showingMySchedule;
  document.getElementById('mySchedBtn').classList.toggle('active', showingMySchedule);
  document.getElementById('mainScheduleView').classList.toggle('hidden', showingMySchedule);
  document.getElementById('filterBar').style.display = showingMySchedule ? 'none' : '';
  document.getElementById('myScheduleView').classList.toggle('active', showingMySchedule);
  if (showingMySchedule) renderMySchedule();
}

function toggleFilter(btn) {
  const cat = btn.dataset.cat;
  if (activeFilters.has(cat)) { activeFilters.delete(cat); btn.classList.remove('active'); }
  else                         { activeFilters.add(cat);    btn.classList.add('active');    }
  renderSchedule();
}

function exportSchedule() {
  const lookup = buildSessionLookup();
  const ids = Object.keys(selected).filter(id => selected[id]);
  if (!ids.length) return;
  const byDay = { tuesday: [], wednesday: [] };
  for (const id of ids) { const s = lookup[id]; if (s) byDay[s.day].push(s); }
  const lines = ['TECHORAMA 2026 — MY SCHEDULE', '='.repeat(40), ''];
  for (const [day, label] of [['tuesday','TUESDAY, MAY 12'],['wednesday','WEDNESDAY, MAY 13']]) {
    const ss = byDay[day].sort((a,b) => a.time.localeCompare(b.time));
    if (!ss.length) continue;
    lines.push(label, '-'.repeat(20));
    for (const s of ss) {
      lines.push(`${s.time}  |  ${s.room}  |  ${s.title}`);
      lines.push(`             ${s.speaker}  [${s.cat}]`);
      lines.push('');
    }
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'techorama2026-schedule.txt';
  a.click();
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────

updateCount();
loadData();
</script>
</body>
</html>
