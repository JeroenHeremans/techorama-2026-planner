<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techorama 2026 — My Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e14;
    --surface: #13161f;
    --surface2: #1a1e2a;
    --border: #252a38;
    --accent: #f5a623;
    --accent2: #e05252;
    --text: #e8eaf0;
    --muted: #6b7280;
    --ai: #7c6af5;
    --arch: #e05252;
    --cloud: #38b2ac;
    --data: #f59e0b;
    --dev: #48bb78;
    --workplace: #ed64a6;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    min-height: 60px;
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: .5rem;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }

  .header-controls {
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }

  .tab-group {
    display: flex;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 600;
    padding: .35rem .9rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #0c0e14;
  }

  .my-schedule-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    padding: .35rem .9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .my-schedule-btn.active, .my-schedule-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c0e14;
  }
  .my-schedule-count {
    background: var(--accent2);
    color: white;
    font-size: .7rem;
    border-radius: 99px;
    padding: .1rem .4rem;
    min-width: 1.4rem;
    text-align: center;
  }
  .my-schedule-btn.active .my-schedule-count {
    background: rgba(0,0,0,.3);
    color: #0c0e14;
  }

  /* ── FILTERS ── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-size: .7rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-right: .25rem;
  }
  .filter-chip {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: .75rem;
    font-weight: 600;
    padding: .25rem .7rem;
    border-radius: 99px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--text); color: var(--text); }
  .filter-chip.active { color: #0c0e14; border-color: transparent; }
  .chip-ai.active { background: var(--ai); }
  .chip-arch.active { background: var(--arch); }
  .chip-cloud.active { background: var(--cloud); }
  .chip-data.active { background: var(--data); color: #0c0e14; }
  .chip-dev.active { background: var(--dev); color: #0c0e14; }
  .chip-workplace.active { background: var(--workplace); }

  /* ── MAIN LAYOUT ── */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }

  /* ── TIME BLOCKS ── */
  .time-block {
    margin-bottom: 2rem;
  }

  .time-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: .75rem;
  }

  .time-label {
    font-family: 'DM Mono', monospace;
    font-size: .85rem;
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
  }

  .time-divider {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── BREAK / EVENT CARDS ── */
  .event-special {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .6rem 1rem;
    font-size: .85rem;
    color: var(--muted);
    font-style: italic;
    margin-bottom: .5rem;
  }

  /* ── SESSION GRID ── */
  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: .75rem;
  }

  /* ── SESSION CARD ── */
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    transition: border-color .2s, transform .15s, box-shadow .2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .session-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(245,166,35,.1);
  }
  .session-card.selected {
    border-color: var(--accent);
    background: #1e1b10;
    box-shadow: 0 0 0 2px rgba(245,166,35,.2);
  }
  .session-card.conflict {
    border-color: var(--accent2) !important;
    background: #1e1010;
  }
  .session-card.hidden { display: none; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: .5rem;
  }

  .card-room {
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .card-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    font-size: .7rem;
  }
  .session-card.selected .card-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c0e14;
  }
  .session-card.conflict .card-check {
    background: var(--accent2);
    border-color: var(--accent2);
    color: white;
  }

  .card-title {
    font-size: .9rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .card-speaker {
    font-size: .8rem;
    color: var(--muted);
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
    margin-top: .25rem;
  }

  .tag-category {
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: .2rem .6rem;
    border-radius: 99px;
    color: white;
  }
  .tag-ai { background: var(--ai); }
  .tag-arch { background: var(--arch); }
  .tag-cloud { background: var(--cloud); color: #0c0e14; }
  .tag-data { background: var(--data); color: #0c0e14; }
  .tag-dev { background: var(--dev); color: #0c0e14; }
  .tag-workplace { background: var(--workplace); }

  .tag-level {
    font-size: .65rem;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: .2rem .6rem;
    border-radius: 99px;
  }

  .conflict-badge {
    font-size: .65rem;
    font-weight: 700;
    color: var(--accent2);
    display: none;
  }
  .session-card.conflict .conflict-badge { display: inline; }

  /* ── MY SCHEDULE VIEW ── */
  .my-schedule-view { display: none; }
  .my-schedule-view.active { display: block; }
  .main-schedule-view { display: block; }
  .main-schedule-view.hidden { display: none; }

  .schedule-day-header {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent);
    margin: 1.5rem 0 1rem;
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .schedule-day-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .my-schedule-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .9rem 1.1rem;
    margin-bottom: .5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .my-item-time {
    font-family: 'DM Mono', monospace;
    font-size: .75rem;
    color: var(--accent);
    white-space: nowrap;
    min-width: 90px;
  }
  .my-item-room {
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    color: var(--muted);
    min-width: 60px;
  }
  .my-item-title {
    flex: 1;
    font-size: .9rem;
    font-weight: 700;
  }
  .my-item-speaker {
    font-size: .8rem;
    color: var(--muted);
  }
  .my-item-remove {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: .2rem;
    transition: color .2s;
    flex-shrink: 0;
  }
  .my-item-remove:hover { color: var(--accent2); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 4rem 2rem;
  }
  .empty-state p:first-child {
    font-size: 2rem;
    margin-bottom: .5rem;
  }
  .empty-state p:last-child {
    font-size: .9rem;
  }

  /* ── EXPORT ── */
  .export-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 1rem;
  }
  .export-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    padding: .4rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: .75rem 1rem; gap: .5rem; }
    .logo { font-size: 1rem; }
    .tab-btn { padding: .3rem .6rem; font-size: .75rem; }
    main { padding: 1rem .75rem 3rem; }
    .sessions-grid { grid-template-columns: 1fr; }
    .my-schedule-item { flex-wrap: wrap; gap: .4rem; }
    .my-item-time { min-width: auto; }
    .my-item-room { min-width: auto; }
  }
</style>
</head>

</div>

<main>
  <div class="main-schedule-view" id="mainScheduleView"></div>
  <div class="my-schedule-view" id="myScheduleView"></div>
</main>

// ─── STATE ───────────────────────────────────────────────────────────────────

let currentDay = 'tuesday';
let showingMySchedule = false;
let selected = JSON.parse(localStorage.getItem('techorama_selected') || '{}');
let activeFilters = new Set(['AI & Agents','Architecture & Leadership','Cloud & DevOps','Data','Dev','Workplace & Productivity']);

function saveSelected() {
  localStorage.setItem('techorama_selected', JSON.stringify(selected));
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function catClass(cat) {
  const map = {
    'AI & Agents': 'ai',
    'Architecture & Leadership': 'arch',
    'Cloud & DevOps': 'cloud',
    'Data': 'data',
    'Dev': 'dev',
    'Workplace & Productivity': 'workplace',
  };
  return map[cat] || 'dev';
}

function catShort(cat) {
  const map = {
    'AI & Agents': 'AI & Agents',
    'Architecture & Leadership': 'Architecture',
    'Cloud & DevOps': 'Cloud & DevOps',
    'Data': 'Data',
    'Dev': 'Dev',
    'Workplace & Productivity': 'Workplace',
  };
  return map[cat] || cat;
}

function getConflicts() {
  // Map time → selected sessions
  const timeMap = {};
  const allData = [...TUESDAY.map(b => ({...b, day:'tuesday'})), ...WEDNESDAY.map(b => ({...b, day:'wednesday'}))];
  for (const block of allData) {
    if (!block.sessions) continue;
    for (const s of block.sessions) {
      if (selected[s.id]) {
        const key = s.day + '_' + block.time;
        if (!timeMap[key]) timeMap[key] = [];
        timeMap[key].push(s.id);
      }
    }
  }
  const conflictIds = new Set();
  for (const ids of Object.values(timeMap)) {
    if (ids.length > 1) ids.forEach(id => conflictIds.add(id));
  }
  return conflictIds;
}

// Build a lookup: sessionId → time slot
function buildTimeIndex() {
  const idx = {};
  for (const block of TUESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) idx[s.id] = block.time;
  }
  for (const block of WEDNESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) idx[s.id] = block.time;
  }
  return idx;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function renderSchedule() {
  const data = currentDay === 'tuesday' ? TUESDAY : WEDNESDAY;
  const conflicts = getConflicts();
  const container = document.getElementById('mainScheduleView');
  container.innerHTML = '';

  for (const block of data) {
    const div = document.createElement('div');
    div.className = 'time-block';

    if (block.special) {
      div.innerHTML = `
        <div class="time-header">
          <span class="time-label">${block.time}</span>
          <div class="time-divider"></div>
        </div>
        <div class="event-special">${block.special}</div>
      `;
    } else {
      const sessionsHTML = block.sessions.map(s => {
        const isSelected = !!selected[s.id];
        const isConflict = conflicts.has(s.id);
        const hidden = !activeFilters.has(s.cat) ? ' hidden' : '';
        return `
          <div class="session-card${isSelected ? ' selected' : ''}${isConflict ? ' conflict' : ''}${hidden}"
               id="card-${s.id}" onclick="toggleSession('${s.id}', '${block.time}', '${currentDay}')">
            <div class="card-top">
              <span class="card-room">${s.room}</span>
              <div class="card-check">${isSelected ? '✓' : ''}</div>
            </div>
            <div class="card-title"><a href="${s.url}" target="_blank" onclick="event.stopPropagation()" style="color:inherit;text-decoration:none;">${s.title}</a></div>
            <div class="card-speaker">${s.speaker}</div>
            <div class="card-footer">
              <span class="tag-category tag-${catClass(s.cat)}">${catShort(s.cat)}</span>
              <span class="tag-level">${s.level}</span>
              <span class="conflict-badge">⚠ conflict</span>
            </div>
          </div>`;
      }).join('');

      div.innerHTML = `
        <div class="time-header">
          <span class="time-label">${block.time}</span>
          <div class="time-divider"></div>
        </div>
        <div class="sessions-grid">${sessionsHTML}</div>
      `;
    }
    container.appendChild(div);
  }
}

function renderMySchedule() {
  const view = document.getElementById('myScheduleView');
  const ids = Object.keys(selected).filter(id => selected[id]);

  if (ids.length === 0) {
    view.innerHTML = `<div class="empty-state"><p>📋</p><p>No sessions added yet.<br>Browse the schedule and click any session to add it.</p></div>`;
    return;
  }

  // Build session lookup
  const allSessions = {};
  const timeIdx = {};
  for (const block of TUESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) {
      allSessions[s.id] = { ...s, day: 'tuesday', time: block.time };
      timeIdx[s.id] = block.time;
    }
  }
  for (const block of WEDNESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) {
      allSessions[s.id] = { ...s, day: 'wednesday', time: block.time };
      timeIdx[s.id] = block.time;
    }
  }

  const tueSessions = ids.filter(id => allSessions[id]?.day === 'tuesday')
    .map(id => allSessions[id]).sort((a,b) => a.time.localeCompare(b.time));
  const wedSessions = ids.filter(id => allSessions[id]?.day === 'wednesday')
    .map(id => allSessions[id]).sort((a,b) => a.time.localeCompare(b.time));

  const conflicts = getConflicts();

  const renderItems = (sessions) => sessions.map(s => `
    <div class="my-schedule-item" style="${conflicts.has(s.id) ? 'border-color:var(--accent2)' : ''}">
      <div class="my-item-time">${s.time}</div>
      <div class="my-item-room">${s.room}</div>
      <div>
        <div class="my-item-title"><a href="${s.url}" target="_blank" style="color:inherit;text-decoration:none;">${s.title}</a></div>
        <div class="my-item-speaker">${s.speaker} &middot; <span class="tag-category tag-${catClass(s.cat)}" style="font-size:.6rem;padding:.15rem .5rem;">${catShort(s.cat)}</span>${conflicts.has(s.id) ? ' <span style="color:var(--accent2);font-size:.75rem;">⚠ conflict</span>' : ''}</div>
      </div>
      <button class="my-item-remove" onclick="removeSession('${s.id}')" title="Remove">✕</button>
    </div>
  `).join('');

  const exportBtnHTML = `
    <div class="export-bar">
      <button class="export-btn" onclick="exportSchedule()">⬇ Export as text</button>
    </div>`;

  let html = exportBtnHTML;
  if (tueSessions.length > 0) {
    html += `<div class="schedule-day-header">Tuesday, May 12</div>` + renderItems(tueSessions);
  }
  if (wedSessions.length > 0) {
    html += `<div class="schedule-day-header">Wednesday, May 13</div>` + renderItems(wedSessions);
  }

  view.innerHTML = html;
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────

function toggleSession(id, time, day) {
  selected[id] = !selected[id];
  if (!selected[id]) delete selected[id];
  saveSelected();
  updateCount();
  if (showingMySchedule) {
    renderMySchedule();
  } else {
    // Re-render just the cards to handle conflict indicators
    renderSchedule();
  }
}

function removeSession(id) {
  delete selected[id];
  saveSelected();
  updateCount();
  renderMySchedule();
  // Also refresh schedule view card state
}

function updateCount() {
  const count = Object.keys(selected).length;
  document.getElementById('mySchedCount').textContent = count;
}

function switchDay(day) {
  currentDay = day;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && day === 'tuesday') || (i === 1 && day === 'wednesday'));
  });
  if (!showingMySchedule) renderSchedule();
}

function toggleMySchedule() {
  showingMySchedule = !showingMySchedule;
  document.getElementById('mySchedBtn').classList.toggle('active', showingMySchedule);
  document.getElementById('mainScheduleView').classList.toggle('hidden', showingMySchedule);
  document.getElementById('filterBar').style.display = showingMySchedule ? 'none' : '';
  document.getElementById('myScheduleView').classList.toggle('active', showingMySchedule);
  if (showingMySchedule) renderMySchedule();
}

function toggleFilter(btn) {
  const cat = btn.dataset.cat;
  if (activeFilters.has(cat)) {
    activeFilters.delete(cat);
    btn.classList.remove('active');
  } else {
    activeFilters.add(cat);
    btn.classList.add('active');
  }
  renderSchedule();
}

function exportSchedule() {
  const allSessions = {};
  for (const block of TUESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) allSessions[s.id] = { ...s, day: 'Tuesday', time: block.time };
  }
  for (const block of WEDNESDAY) {
    if (!block.sessions) continue;
    for (const s of block.sessions) allSessions[s.id] = { ...s, day: 'Wednesday', time: block.time };
  }

  const ids = Object.keys(selected).filter(id => selected[id]);
  if (!ids.length) return;

  const lines = ['TECHORAMA 2026 — MY SCHEDULE', '='.repeat(40), ''];
  const byDay = { Tuesday: [], Wednesday: [] };
  for (const id of ids) {
    const s = allSessions[id];
    if (s) byDay[s.day].push(s);
  }
  for (const day of ['Tuesday', 'Wednesday']) {
    const sessions = byDay[day].sort((a,b) => a.time.localeCompare(b.time));
    if (!sessions.length) continue;
    lines.push(day.toUpperCase(), '-'.repeat(20));
    for (const s of sessions) {
      lines.push(`${s.time}  |  ${s.room}  |  ${s.title}`);
      lines.push(`            ${s.speaker}  [${s.cat}]`);
      lines.push('');
    }
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'techorama2026-schedule.txt';
  a.click();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

updateCount();
renderSchedule();
</script>
</body>
</html>
